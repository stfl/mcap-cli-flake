name: Update nixpkgs and mcap-cli

# Weekly: bump the pinned nixpkgs, then bump the packaged mcap-cli release when
# upstream has tagged a newer one. Verified before pushing, because a push made
# with GITHUB_TOKEN does not trigger `on: push` workflows.
#
# --version-regex must stay in step with package.nix's passthru.updateScript, which
# declares the same regex for the nixpkgs update machinery; nix-update invoked
# directly does not read passthru, so both carry it.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays at 07:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main

      - name: Record starting commit
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Update flake.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          nix flake update
          if ! git diff --quiet flake.lock; then
            NIXPKGS_REV=$(nix flake metadata --json | nix run --inputs-from . nixpkgs#jq -- -r '.locks.nodes.nixpkgs.locked.rev')
            git add flake.lock
            git commit -m "flake.lock: update nixpkgs to ${NIXPKGS_REV}"
          fi

      # nix-update evaluates the flake through nix-instantiate, which cannot open
      # inputs that lazy-trees leaves virtual; archiving puts them in the store.
      #
      # --use-github-releases pages the releases API. The default releases.atom feed
      # holds too few entries to still contain the last mcap-cli release, because
      # foxglove/mcap releases many other components.
      - name: Bump mcap-cli to the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix flake archive
          nix run --inputs-from . nixpkgs#nix-update -- \
            --flake --commit --use-github-releases \
            --version-regex 'releases/mcap-cli/v(.*)' mcap-cli

      - name: Did anything change?
        id: changed
        run: |
          if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then
            echo "Nothing to update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.changed.outputs.changed == 'true'
        run: nix build .#mcap-cli -L

      - name: Smoke test
        if: steps.changed.outputs.changed == 'true'
        run: ci/smoke-test.sh

      - name: Push
        if: steps.changed.outputs.changed == 'true'
        run: git push

      - name: Trigger FlakeHub publish
        if: steps.changed.outputs.changed == 'true'
        run: gh workflow run flakehub-publish.yml --repo "$GITHUB_REPOSITORY"
