name: Publish rolling release to FlakeHub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flakehub-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3
      - uses: DeterminateSystems/flakehub-push@2769db2f8d26fe4fa21b37428901bc2b6a54e012 # main
        with:
          visibility: public
          name: stfl/mcap-cli
          rolling: true
          include-output-paths: true
